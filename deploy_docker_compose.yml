version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bit_health_db
    environment:
      POSTGRES_USER: bit_health_user
      POSTGRES_PASSWORD: bit_health_password
      POSTGRES_DB: bit_health_db
      # 앱 코드는 지금 Postgres의 now()/CURRENT_TIMESTAMP를 쓰지 않아 당장 문제는
      # 없지만, 나중에 server_default=func.now()나 raw SQL NOW()가 추가되면
      # DB 컨테이너가 UTC 기본값이라 KST(naive) 컬럼에 값이 섞여 들어갈 수 있다.
      # 방어적으로 backend/frontend와 동일하게 맞춰 둔다.
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 호스트 포트를 열지 않는다. 앱은 도커 네트워크 내부에서 db:5432로 접근하며,
    # 외부에 노출하면 인터넷에서 DB로 직접 접속을 시도할 수 있다.
    restart: always

  backend:
    build: ./backend
    container_name: bit_health_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # 호스트 포트를 열지 않는다. Caddy가 도커 내부에서 bit_health_backend:8000으로
    # 리버스 프록시하므로, 8002를 열면 Caddy(HTTPS)를 우회해 평문 HTTP로 API·문서에
    # 직접 접근할 수 있게 된다(확인된 노출면).
    environment:
      DATABASE_URL: postgresql://bit_health_user:bit_health_password@db:5432/bit_health_db
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      TZ: Asia/Seoul
    depends_on:
      - db
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://book.bit.kr
    container_name: bit_health_frontend
    environment:
      NEXT_PUBLIC_API_URL: https://book.bit.kr
      TZ: Asia/Seoul
    depends_on:
      - backend
    restart: always

  caddy:
    image: caddy:2-alpine
    container_name: bit_health_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
